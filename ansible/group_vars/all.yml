# ---------------------------------------------------------------------------
# wg-easy role variables — COPY-PASTE TEMPLATE.
#
# Everything here is COMMENTED OUT on purpose. Ansible precedence is:
#
#   role defaults/main.yml  <  inventory [wg_easy:vars]  <  this file  <  -e
#
# If the values below were live they would silently override your inventory,
# so this file only documents them. Configure one of:
#
#   1. inventory.ini  ->  [wg_easy:vars]   (per group / host)
#   2. -e wg_easy_port=50000               (one-off, always wins)
#   3. uncomment lines below               (playbook-wide)
# ---------------------------------------------------------------------------

# --- UI / TLS --------------------------------------------------------------
# FQDN shown in the browser, or a bare IP (e.g. 203.0.113.10). Required.
# A bare IP switches Caddy to its internal CA and adds the no-SNI workaround.
# wg_easy_domain: vpn.example.com

# letsencrypt -> public cert, needs DNS + inbound tcp/80 and tcp/443
# internal    -> Caddy's own CA, no DNS needed, clients must trust the CA
# wg_easy_tls: letsencrypt

# ACME contact; defaults to admin@<domain>. Only used by the ACME account.
# wg_easy_acme_email: ""

# --- WireGuard -------------------------------------------------------------
# Endpoint advertised to clients; defaults to wg_easy_domain.
# wg_easy_host: ""

# Public UDP port.
# wg_easy_port: 51820

# DNS pushed to VPN clients.
# wg_easy_dns: "1.1.1.1,8.8.8.8"

# Internal docker subnet — also used as TRUSTED_PROXIES.
# wg_easy_subnet: "10.89.89.0/24"

# --- admin (first run only) -------------------------------------------------
# wg_easy_admin_user: admin

# Leave unset to generate one once and keep it in <wg_easy_dir>/.admin_password.
# wg-easy only honours INIT_* on its very first start, so changing this later
# has no effect on an existing install (change it in the UI instead).
# wg_easy_admin_password: ""

# --- images -----------------------------------------------------------------
# wg_easy_image: "ghcr.io/wg-easy/wg-easy:15"
# wg_easy_caddy_image: "caddy:2.10-alpine"

# --- behaviour --------------------------------------------------------------
# Install directory: holds .env, compose.yml, Caddyfile, README.txt
# wg_easy_dir: /opt/wg-easy

# Open the required ports when ufw is already active.
# wg_easy_manage_ufw: true

# Extra users to add to the docker group (the connecting user is added too).
# wg_easy_docker_users: []

# Continue even when the preflight checks fail (e.g. tcp/80 or tcp/443 taken).
# wg_easy_force: false

# Allow non-Ubuntu/Debian targets (best effort).
# wg_easy_skip_os_check: false

# How long to wait for the UI after `compose up` (retries x delay seconds).
# wg_easy_wait_retries: 15
# wg_easy_wait_delay: 4
