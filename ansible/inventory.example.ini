# Copy to inventory.ini and edit.
#
# The playbook needs root (become), so keep ansible_user=root or give a user
# with passwordless sudo.
#
# [wg_easy]
# vpn1 ansible_host=203.0.113.10 ansible_user=root
#
# Use the SSH key you already deploy; never put a password in this file.
# Prefer: ssh keys + ssh-agent, or ansible-vault for anything sensitive.

[wg_easy]
# Example (replace with your host):
# vpn1 ansible_host=203.0.113.10 ansible_user=root

[wg_easy:vars]
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
# ansible_python_interpreter=/usr/bin/python3
